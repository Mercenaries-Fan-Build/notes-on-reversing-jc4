[package]
name = "jc4_formats"
version = "0.1.0"
edition = "2021"
description = "Just Cause 4 (Avalanche Apex) format codecs — TAB/ARC v2 (Oodle), ADF, name hash. Shared by the jc4_* CLIs and jc4_workshop."

[dependencies]
flate2 = "1"              # codec 1 (zlib)
libloading = "0.8"        # runtime-load the game's oo2core_7_win64.dll (Oodle, codec 4)
serde_json = "1"          # ADF typed-tree output
texture2ddecoder = "0.1"  # BCn (BC1-7) block decode → RGBA for the workshop texture view
