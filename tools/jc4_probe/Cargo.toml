[package]
name = "jc4_probe"
version = "0.1.0"
edition = "2021"
description = "JC4 research sandbox — messy, fast-changing experimental logic (name-cracking, brute/heuristic probes) kept OUT of the clean, possibly-public crates (jc4_formats/jc4_arc). Nothing here is API-stable."

[[bin]]
name = "jc4_probe"
path = "src/main.rs"

[dependencies]
jc4_formats = { path = "../jc4_formats" }
rayon = "1"        # data-parallel candidate hashing across cores
# GPU combinator: on-device candidate generation + lookup3 + binary-search match against target hashes.
wgpu = "22"
pollster = "0.3"   # block_on for the headless compute device
bytemuck = { version = "1", features = ["derive"] }
