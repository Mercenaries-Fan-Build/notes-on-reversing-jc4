[package]
name = "jc4_adf"
version = "0.1.0"
edition = "2021"
description = "Just Cause 4 ADF (Avalanche Data Format) typed decoder — reflection-based binary → JSON"

[[bin]]
name = "jc4_adf"
path = "src/main.rs"

[dependencies]
serde_json = "1"   # typed-tree output

[profile.release]
opt-level = 3
